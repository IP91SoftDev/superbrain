name: Release Server Package

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'superbrain-cli/**'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio httpx
        working-directory: backend

      - name: Start API server
        run: |
          nohup python api.py > /tmp/superbrain-api.log 2>&1 &
          echo "API server starting (PID $!)..."
        working-directory: backend

      - name: Wait for API to be ready
        run: |
          for i in $(seq 1 30); do
            TOKEN=$(cat token.txt 2>/dev/null | tr -d '[:space:]')
            if [ -n "$TOKEN" ]; then
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "X-API-Key: $TOKEN" http://localhost:5000/recent?limit=1 2>/dev/null || true)
              if [ "$STATUS" = "200" ]; then
                echo "API ready (HTTP $STATUS) after ${i}s"
                exit 0
              fi
            fi
            sleep 1
          done
          echo "API did not become ready. Server log:"
          cat /tmp/superbrain-api.log
          exit 1
        working-directory: backend

      - name: Run backend tests
        run: python -m pytest tests/ -v --disable-warnings
        working-directory: backend

  publish-server:
    name: Publish Server Package (npmjs + GitHub Packages)
    needs: test-backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Prepare package payload
        run: node scripts/build.js
        working-directory: superbrain-cli

      - name: Resolve release version
        id: vars
        shell: bash
        run: |
          VERSION_BASE=$(node -e "const v=require('./superbrain-cli/package.json').version; console.log(v.split('-')[0]);")
          echo "version=$VERSION_BASE" >> "$GITHUB_OUTPUT"
          echo "owner_scope=@${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "repo_url=https://github.com/${GITHUB_REPOSITORY}.git" >> "$GITHUB_OUTPUT"

      - name: Check version is not already published
        shell: bash
        run: |
          EXISTS=$(npm view superbrain-server@${{ steps.vars.outputs.version }} version 2>/dev/null || true)
          if [ -n "$EXISTS" ]; then
            echo "Version ${{ steps.vars.outputs.version }} already exists on npmjs. Bump superbrain-cli/package.json and merge again."
            exit 1
          fi
          echo "Version ${{ steps.vars.outputs.version }} is new — proceeding."

      - name: Set npmjs metadata
        shell: bash
        run: |
          cd superbrain-cli
          npm pkg set "version=${{ steps.vars.outputs.version }}"
          npm pkg set "repository=${{ steps.vars.outputs.repo_url }}"
          npm pkg set "publishConfig.registry=https://registry.npmjs.org"
          npm pkg set "publishConfig.access=public"

      - name: Publish to npmjs.com
        run: npm publish --tag latest
        working-directory: superbrain-cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Set GitHub Packages metadata
        shell: bash
        run: |
          cd superbrain-cli
          npm pkg set "name=${{ steps.vars.outputs.owner_scope }}/superbrain-server"
          npm pkg set "publishConfig.registry=https://npm.pkg.github.com"

      - name: Configure npm auth for GitHub Packages
        shell: bash
        run: |
          NPMRC="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          echo "${{ steps.vars.outputs.owner_scope }}:registry=https://npm.pkg.github.com" > "$NPMRC"
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> "$NPMRC"
          echo "always-auth=true" >> "$NPMRC"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages
        run: npm publish --tag latest
        working-directory: superbrain-cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
