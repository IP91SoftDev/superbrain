name: Release (Main)

on:
  push:
    branches: [main]
    paths:
      - 'superbrain-app/**'
      - 'backend/**'
      - 'superbrain-cli/**'
  pull_request:
    branches: [main]
    paths:
      - 'superbrain-app/**'
      - 'backend/**'
      - 'superbrain-cli/**'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio httpx
        working-directory: backend

      - name: Start API server
        run: |
          nohup python api.py > /tmp/superbrain-api.log 2>&1 &
          echo "API server starting (PID $!)..."
        working-directory: backend

      - name: Wait for API to be ready
        run: |
          for i in $(seq 1 30); do
            TOKEN=$(cat token.txt 2>/dev/null | tr -d '[:space:]')
            if [ -n "$TOKEN" ]; then
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "X-API-Key: $TOKEN" http://localhost:5000/recent?limit=1 2>/dev/null || true)
              if [ "$STATUS" = "200" ]; then
                echo "API ready (HTTP $STATUS) after ${i}s"
                exit 0
              fi
            fi
            sleep 1
          done
          echo "API did not become ready. Server log:"
          cat /tmp/superbrain-api.log
          exit 1
        working-directory: backend

      - name: Run backend tests
        run: python -m pytest tests/ -v --disable-warnings
        working-directory: backend

  build-apk:
    name: Build & Release APK
    needs: test-backend
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS dependencies
        run: |
          npm cache clean --force
          npm ci || npm install
        working-directory: superbrain-app

      - name: Set Android SDK local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > superbrain-app/android/local.properties

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.npm
          key: gradle-npm-${{ hashFiles('superbrain-app/package-lock.json', 'superbrain-app/android/**/*.gradle*', 'superbrain-app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-npm-
            gradle-

      - name: Make gradlew executable
        run: chmod +x superbrain-app/android/gradlew

      - name: Build release APK
        run: cd superbrain-app/android && ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Locate and rename APK
        run: |
          APK_PATH=$(find superbrain-app/android/app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "APK found at: $APK_PATH"
          cp "$APK_PATH" superbrain.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: superbrain-release-${{ github.run_number }}
          path: superbrain.apk
          retention-days: 30

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          VERSION_BASE=$(node -e "const v=require('./superbrain-cli/package.json').version; console.log(v.split('-')[0]);")
          echo "version=$VERSION_BASE" >> "$GITHUB_OUTPUT"
          echo "release_tag=v${VERSION_BASE}" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          name: "SuperBrain v${{ steps.meta.outputs.version }}"
          body: |
            ## SuperBrain v${{ steps.meta.outputs.version }}

            - Branch: `main`
            - Build: ${{ github.run_number }}
            - Commit: ${{ github.sha }}

            ### Downloads
            - Android APK: `superbrain.apk` (attached below)

            ### npm packages published
            - `superbrain-server@${{ steps.meta.outputs.version }}` on [npmjs.com](https://www.npmjs.com/package/superbrain-server)
            - `@sidinsearch/superbrain-server@${{ steps.meta.outputs.version }}` on [GitHub Packages](https://github.com/sidinsearch/superbrain/pkgs/npm/superbrain-server)
          prerelease: false
          make_latest: true
          generate_release_notes: true
          overwrite_files: true
          files: superbrain.apk

  publish-server:
    name: Publish Server Package (npmjs + GitHub Packages)
    needs: test-backend
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Prepare package payload
        run: node scripts/build.js
        working-directory: superbrain-cli

      - name: Resolve release version
        id: vars
        shell: bash
        run: |
          VERSION_BASE=$(node -e "const v=require('./superbrain-cli/package.json').version; console.log(v.split('-')[0]);")
          if [[ "$VERSION_BASE" == *"-beta"* || "$VERSION_BASE" == *"-beta."* ]]; then
            echo "Stable release must not have a -beta version (got $VERSION_BASE). Bump superbrain-cli/package.json to the next stable version and merge again."
            exit 1
          fi
          echo "version=$VERSION_BASE" >> "$GITHUB_OUTPUT"
          echo "owner_scope=@${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "repo_url=https://github.com/${GITHUB_REPOSITORY}.git" >> "$GITHUB_OUTPUT"

      - name: Check version is not already published
        shell: bash
        run: |
          EXISTS=$(npm view superbrain-server@${{ steps.vars.outputs.version }} version 2>/dev/null || true)
          if [ -n "$EXISTS" ]; then
            echo "Version ${{ steps.vars.outputs.version }} already exists on npmjs. Bump superbrain-cli/package.json and merge again."
            exit 1
          fi
          echo "Version ${{ steps.vars.outputs.version }} is new — proceeding."

      - name: Set version metadata
        shell: bash
        run: |
          cd superbrain-cli
          npm pkg set "version=${{ steps.vars.outputs.version }}"
          npm pkg set "repository=${{ steps.vars.outputs.repo_url }}"
          npm pkg set "publishConfig.registry=https://registry.npmjs.org"
          npm pkg set "publishConfig.access=public"

      - name: Publish to npmjs.com
        run: npm publish --tag latest
        working-directory: superbrain-cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Set GitHub Packages metadata
        shell: bash
        run: |
          cd superbrain-cli
          npm pkg set "name=${{ steps.vars.outputs.owner_scope }}/superbrain-server"
          npm pkg set "publishConfig.registry=https://npm.pkg.github.com"

      - name: Configure npm auth for GitHub Packages
        shell: bash
        run: |
          echo "${{ steps.vars.outputs.owner_scope }}:registry=https://npm.pkg.github.com" > ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages
        run: npm publish --tag latest
        working-directory: superbrain-cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
