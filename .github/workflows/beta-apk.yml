name: Beta APK Build

on:
  push:
    branches: [beta]
    paths:
      - 'superbrain-app/**'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type: debug or release'
        required: false
        default: 'release'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Beta APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install JS dependencies
        run: |
          npm cache clean --force
          npm ci || npm install
        working-directory: superbrain-app

      - name: Set Android SDK local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > superbrain-app/android/local.properties

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.npm
          key: gradle-npm-${{ hashFiles('superbrain-app/package-lock.json', 'superbrain-app/android/**/*.gradle*', 'superbrain-app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-npm-
            gradle-

      - name: Make gradlew executable
        run: chmod +x superbrain-app/android/gradlew

      - name: Build APK
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'release' }}"
          TASK="assemble$(echo ${BUILD_TYPE^})"
          cd superbrain-app/android && ./gradlew $TASK --no-daemon --stacktrace

      - name: Locate and rename APK
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'release' }}"
          APK_PATH=$(find superbrain-app/android/app/build/outputs/apk/${BUILD_TYPE} -name "*.apk" | head -1)
          echo "APK found at: $APK_PATH"
          cp "$APK_PATH" superbrain-beta.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: superbrain-beta-${{ github.run_number }}
          path: superbrain-beta.apk
          retention-days: 30

      - name: Resolve beta release metadata
        id: meta
        shell: bash
        run: |
          VERSION_BASE=$(node -e "const v=require('./superbrain-cli/package.json').version; console.log(v.split('-')[0]);")
          VERSION="${VERSION_BASE}-beta.${GITHUB_RUN_NUMBER}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create or update beta prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          name: "SuperBrain Beta v${{ steps.meta.outputs.version }}"
          body: |
            ## SuperBrain Beta ${{ steps.meta.outputs.version }}

            - Branch: `beta`
            - Build: ${{ github.run_number }}
            - Commit: ${{ github.sha }}

            ⚠️ Pre-release — for testing only. APK downloaded below. npm packages are **not** published from beta.
          prerelease: true
          make_latest: false
          generate_release_notes: true
          overwrite_files: true
          files: superbrain-beta.apk
